# Fly.io: one machine with a small volume so SQLite survives restarts and deploys.
# `fly launch --no-deploy --copy-config`, `fly volumes create patient_data --size 1`, then `fly deploy`.
app = "patient-voice-agent"   # must be globally unique: change it
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"
  DATABASE_URL = "sqlite:////data/patients.db"
  SEED_DEMO_DATA = "true"

[mounts]
  source = "patient_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # a phone call must never hit a cold start
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
